<!--
  ============================================================
  オンラインボッチャ ランプ操作アプリ（デモ用／操作確認のみ）
  ============================================================
  ※このファイルは公開デモ用です。コード自体には実機のdevice IDを
    含めていません（デフォルトはダミーID"00000000"固定で、実機には
    繋がりません）。実IDをコードに書き込む・置き換えることは絶対に
    行わないでください。実機での動作確認が必要な場合は、下記の
    urlパラメータ`id`でその場限りの値としてURLに渡してください
    （実IDをコード・コミット・このリポジトリのどこにも残さないこと）。
    本番の実機制御コードはobniz社リポジトリ(将来的にAzureへ移行予定)で
    別途管理しています。

  操作パネルの横に、たかさ・方向を示すゲージ状イラストを表示する機能を
  含みます（実装の経緯はdocs/ramp-illustration-poc.mdを参照）。

  起動時URLパラメータで、デモ・操作画面パターンを切り替えられます。
  詳細は本ファイル内「起動パラメータ一覧」コメントを参照してください。

  例）
    RAMP-DEMO.html                         … デモモード・標準UI（デフォルト）
    RAMP-DEMO.html?d=1                     … デモモード・標準UI
    RAMP-DEMO.html?p=1                     … デモモード・△パネルUI
    RAMP-DEMO.html?d=1&p=1                 … デモモード・△パネルUI
    RAMP-DEMO.html?rn=2&rs=L&lg=F&d=1&p=1  … 全パラメータ指定の例
    RAMP-DEMO.html?d=0&p=1&id=12345678     … 実機モードで実IDを一時指定する例
                                              （idは8桁の数字。実機確認時のみ使用）

  なお、p=0（標準UI）は現状、jQuery/Bootstrap CSS/obniz-parts-kits一式を
  obniz.io・unpkg.com・stackpath CDNから動的読み込みする仕様のままです
  （自リポジトリへの取り込み＝vendoringは未対応。将来対応を検討）。
  ============================================================
-->
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ============================================================
         ★追加: 画面上部にJSエラーを表示するバナー（原因切り分け用）
         CSS等の読み込み失敗(致命的でない)は無視し、JSの実行エラーのみ表示する
         ============================================================ -->
    <script>
      function showFatalBanner(text) {
        var msg = document.getElementById('fatal-error-banner');
        if (!msg) {
          msg = document.createElement('div');
          msg.id = 'fatal-error-banner';
          msg.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#d32f2f;color:#fff;padding:10px 14px;font-size:13px;z-index:9999;white-space:pre-wrap;font-family:monospace;';
          document.body.prepend(msg);
        }
        msg.textContent += (msg.textContent ? '\n' : '') + text;
      }
      window.addEventListener('error', function (e) {
        var isScriptError = (e.target === window) || !!e.error;
        if (!isScriptError) return;
        var text = 'エラー: ' + (e.message || (e.error && e.error.message) || '不明なエラー');
        if (e.filename) text += '\n  場所: ' + e.filename + ':' + e.lineno;
        showFatalBanner(text);
      }, true);
      // ★追加: await中に失敗したPromise（obniz.js読み込み失敗等）も拾う
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var text = 'エラー(非同期): ' + (reason && reason.message ? reason.message : String(reason));
        showFatalBanner(text);
      });
    </script>

    <!-- ============================================================
         ★追加: 起動直後（操作ボタンを押すまで）だけ、数字キーで表示UI(p)を
         切り替えられる仕組み。1 = 標準UI(p=0) / 2 = △パネルUI(p=1)
         いずれかの操作ボタンが押された時点で自動的に無効化する。
         URLパラメータを書き換えてページを再読み込みするだけの単純な仕組み。
         ============================================================ -->
    <script>
      (function () {
        var disabled = false;

        function disable() {
          disabled = true;
          window.removeEventListener('keydown', handler);
          document.removeEventListener('click', onAnyButtonClick, true);
        }

        // ★いずれかの操作ボタン（△パネル/標準UIどちらのボタンも）が押されたら無効化
        function onAnyButtonClick(e) {
          var t = e.target;
          if (t && t.closest && (t.closest('#customPanelWrap .btn') || t.closest('#OBNIZ_OUTPUT button'))) {
            disable();
          }
        }

        function handler(e) {
          if (disabled) return;
          var url = new URL(window.location.href);
          if (e.key === '1') {
            url.searchParams.set('p', '0');
            window.location.href = url.toString();
          } else if (e.key === '2') {
            url.searchParams.set('p', '1');
            window.location.href = url.toString();
          }
        }

        window.addEventListener('keydown', handler);
        document.addEventListener('click', onAnyButtonClick, true);
      })();
    </script>

    <!-- ============================================================
         ★追加【スマホで読み上げが無音になる対策・その2】:
         iOS Safari等では、speechSynthesis.speak()がユーザーの実際の
         タップ操作から間を置かず(同期的に)呼ばれないと無音になる制限が
         ある。本体側は状態機械ループを介して非同期にspeak()を呼ぶため
         (ボタン押下から最大500ms程度の遅延がある)、iOS Safariには
         「ユーザー操作起点」と認識されず無音になっている可能性がある。
         ページ内で最初に検知したタップ/クリックのタイミングで、
         ほぼ無音の発声を1回直接実行して「解錠」しておくことで、
         以降の非同期なspeak()呼び出しでも音が鳴るようにする
         (iOSでのAudioContext解錠と同種の定番の回避策)。
         ============================================================ -->
    <script>
      (function () {
        if (typeof speechSynthesis === 'undefined') return;
        var unlocked = false;
        function unlockSpeech() {
          if (unlocked) return;
          unlocked = true;
          try {
            var u = new SpeechSynthesisUtterance(' ');
            u.volume = 0.01;
            speechSynthesis.speak(u);
          } catch (e) { /* 無視 */ }
          document.removeEventListener('click', unlockSpeech, true);
          document.removeEventListener('touchend', unlockSpeech, true);
        }
        document.addEventListener('click', unlockSpeech, true);
        document.addEventListener('touchend', unlockSpeech, true);
      })();
    </script>

    <!-- ============================================================
         ★追加: 簡易jQuery代替
         外部CDN(jquery-3.2.1.min.js)への依存をなくすための自前実装。
         obniz-parts-kits の ui/index.js が使う最小限の機能のみ。
         実機/デモ両方のモードで共通して使用する。
         ============================================================ -->
    <!-- ============================================================
         ★変更: 軽量jQuery代替／ObnizUI(Button/Label)自前実装は、
         △パネルUI（p=1）の時だけ使う関数として定義しておく
         （即時実行せず、main()内でPANEL_MODEを見てから呼び出す）。
         標準UI（p=0）の時は、この下で本物のjQuery/obniz-parts-kits/
         Bootstrapを動的に読み込み、"もともとの標準UI"をそのまま使う。
         ============================================================ -->
    <script>
      function installLightweightJQuery() {
        window.$ = window.jQuery = function (sel) {
          var els;
          if (typeof sel === 'string') {
            els = Array.prototype.slice.call(document.querySelectorAll(sel));
          } else if (sel && sel.nodeType) {
            els = [sel];
          } else {
            els = [];
          }
          return {
            on: function (events, fn) {
              events.split(' ').forEach(function (ev) {
                els.forEach(function (el) { el.addEventListener(ev, fn); });
              });
              return this;
            },
            text: function (t) {
              els.forEach(function (el) { el.textContent = t; });
              return this;
            },
          };
        };
      }
    </script>

    <script>
      function installLightweightObnizUI() {
        let obniz_ui_counter = 0;

        class ObnizButton {
          constructor(text, size) {
            this.size = (size || 'M').toUpperCase();
            this.no = obniz_ui_counter;
            this.text = text;
            obniz_ui_counter++;
            this.pushed = false;
            this.clicked = false;
            this.width = { S: '33%', M: '50%', L: '100%' };
            this.addButton();
          }
          addButton() {
            let output = document.getElementById('OBNIZ_OUTPUT');
            let button = document.createElement('button');
            button.id = 'obniz_button_' + this.no;
            button.style =
              'width:' + this.width[this.size] + ';height:100px;font-size:30px;';
            button.className = 'btn btn-primary';
            button.innerText = this.text;
            output.appendChild(button);
            const jButton = $('#obniz_button_' + this.no);
            jButton.on('touchstart mousedown', () => { this.touchStart(); });
            jButton.on('touchend mouseup', () => { this.touchEnd(); });
            $(document).on('touchend mouseup', () => { this.touchEnd(); });
            jButton.on('click', () => { this.click(); });
          }
          touchStart() { this.pushed = true; }
          touchEnd() { this.pushed = false; }
          click() { this.clicked = true; }
          isClicked() { let tmp = this.clicked; this.clicked = false; return tmp; }
          isTouching() { return this.pushed; }
        }

        class ObnizLabel {
          constructor(text) {
            this.no = obniz_ui_counter;
            this.text = text || 'label';
            obniz_ui_counter++;
            this.addLabel();
          }
          addLabel() {
            let output = document.getElementById('OBNIZ_OUTPUT');
            let el = document.createElement('div');
            el.id = 'obniz_label_' + this.no;
            el.style = 'font-size:30px;padding:10px';
            el.innerText = this.text;
            output.appendChild(el);
          }
          setText(text) { $('#obniz_label_' + this.no).text(text); }
        }

        window.ObnizUI = {
          Button: ObnizButton,
          Label: ObnizLabel,
          Util: {
            wait: function (ms) {
              return new Promise((resolve) => setTimeout(resolve, ms));
            },
          },
        };
      }

      // ★追加: 標準UI(p=0)の時に、本物のライブラリ群をCDNから動的に読み込む
      // ★修正【p=0でLOADING...のまま無限に止まる不具合対策】: 以前は
      // <script>/<link>のload/errorイベント待ちのみで、通信環境によっては
      // どちらも発火せず(タイムアウトなし)永久に止まってしまい、エラー
      // バナーも出ないまま「LOADING...」から進めなくなることがあった。
      // 一定時間(LOAD_TIMEOUT_MS)経っても応答がなければ、どのURLが
      // 原因かわかるメッセージ付きで明示的に失敗させるようにする。
      const LOAD_TIMEOUT_MS = 15000;
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          let done = false;
          const timer = setTimeout(() => {
            if (done) return;
            done = true;
            reject(new Error(src + ' の読み込みがタイムアウトしました（' + (LOAD_TIMEOUT_MS / 1000) + '秒応答なし。ネットワークをご確認ください）'));
          }, LOAD_TIMEOUT_MS);
          const s = document.createElement('script');
          s.src = src;
          s.onload = () => { if (done) return; done = true; clearTimeout(timer); resolve(); };
          s.onerror = () => { if (done) return; done = true; clearTimeout(timer); reject(new Error(src + ' の読み込みに失敗しました（ネットワークをご確認ください）')); };
          document.head.appendChild(s);
        });
      }
      function loadStylesheet(href) {
        return new Promise((resolve, reject) => {
          let done = false;
          const timer = setTimeout(() => {
            if (done) return;
            done = true;
            reject(new Error(href + ' の読み込みがタイムアウトしました（' + (LOAD_TIMEOUT_MS / 1000) + '秒応答なし。ネットワークをご確認ください）'));
          }, LOAD_TIMEOUT_MS);
          const l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          l.onload = () => { if (done) return; done = true; clearTimeout(timer); resolve(); };
          l.onerror = () => { if (done) return; done = true; clearTimeout(timer); reject(new Error(href + ' の読み込みに失敗しました（ネットワークをご確認ください）')); };
          document.head.appendChild(l);
        });
      }
      async function installOriginalStandardUI() {
        await loadStylesheet('https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css');
        await loadScript('https://obniz.io/js/jquery-3.2.1.min.js');
        await loadScript('https://unpkg.com/obniz-parts-kits@0.18.0/ui/index.js');
        // ★追加: 音(_ai.playAudio)も本物のai/index.js一式を読み込む
        // （元のscriptタグの読み込み順と同じ順序。ai/index.jsが依存するため
        //   howler/opencv/clmtrackr系も全て読み込む必要がある）
        await loadScript('https://unpkg.com/obniz-parts-kits@0.18.0/ai/howler2.1.2/howler.js');
        await loadScript('https://unpkg.com/obniz-parts-kits@0.18.0/ai/opencv3.4/opencv.js');
        await loadScript('https://unpkg.com/obniz-parts-kits@0.18.0/ai/clmtrackr/clmtrackr.js');
        await loadScript('https://unpkg.com/obniz-parts-kits@0.18.0/ai/clmtrackr/emotion_classifier.js');
        await loadScript('https://unpkg.com/obniz-parts-kits@0.18.0/ai/clmtrackr/emotionmodel.js');
        await loadScript('https://unpkg.com/obniz-parts-kits@0.18.0/ai/clmtrackr/model_pca_20_svm.js');
        await loadScript('https://unpkg.com/obniz-parts-kits@0.18.0/ai/index.js');
      }

      // ★修正: _ai.playAudio の自前実装（Web Audio）を、実物の
      // ai/index.js の playAudio と全く同じ挙動になるよう修正。
      // （実物はgainノードを挟まずオシレーターを直結＝音量を絞っていない、
      //   かつ setTimeout(ms) で resolve するため、await した時に
      //   実際に鳴っている時間だけ待たされる。以前の自前実装は
      //   音量を絞り、即座にresolveしてしまっていたため、
      //   標準UI(本物のai/index.js使用)と音・タイミングの両方が
      //   ずれていた。△パネルUI（軽量実装）の時だけ使う。
      function installLightweightAi() {
        window._ai = {
          playAudio: function (hz, ms) {
            return new Promise(function (resolve) {
              try {
                var ctx = window._appAudioCtx ||
                  (window._appAudioCtx = new (window.AudioContext || window.webkitAudioContext)());
                var osc = ctx.createOscillator();
                osc.frequency.value = hz;
                osc.connect(ctx.destination);
                osc.start();
                setTimeout(function () {
                  osc.stop();
                  resolve();
                }, ms);
              } catch (e) {
                resolve();
              }
            });
          },
        };
      }
    </script>

    <style>
      /* ============================================================
         ★変更: Bootstrapの代わりの最小限のボタン装飾は、
         「軽量自前実装(installLightweightObnizUI)を使う時」だけに限定する
         （body.lightweight-ui クラスでスコープ）。
         標準UI(p=0)で本物のBootstrap/obniz-parts-kitsを読み込む場合は、

      /* ============================================================
         ★追加【p=0・スマホ幅対策】: 標準UI(p=0)は本物のobniz-parts-kits
         (ボタンfont-size:30px固定・折り返し無し)をそのまま使っているため、
         スマホ等の狭い画面では文字がボタン枠からはみ出して見切れていた
         （「いちばんうえ」→「いちばんう」等）。外部ライブラリのソースには
         手を入れられないので、レンダリングされた実DOM(#OBNIZ_OUTPUT配下の
         button/ラベル)を対象にCSSで上書きする。obniz-parts-kits側は
         インラインstyleで font-size 等を指定してくるため、!importantで
         上書きする必要がある。 */
      /* ★追加: パネル上部のメッセージ(たかさ...OK!等、obniz_label_*)は
         obniz-parts-kits側の既定フォントサイズがボタン(30px)より小さく、
         「ウィンドウ幅で縮小が効く前から既に小さい」状態になっていた。
         ボタンと同じ基準(30px)から始まり、下の@mediaで同じタイミング
         (600px)一緒に縮小されるよう、ここで明示的にボタンと揃えておく。 */
      #OBNIZ_OUTPUT [id^="obniz_label_"]{
        font-size: 30px !important;
      }
      @media (max-width: 600px) {
        #OBNIZ_OUTPUT button{
          font-size: 15px !important;
          white-space: normal !important;
          word-break: break-word;
          line-height: 1.25 !important;
          padding: 4px !important;
        }
        #OBNIZ_OUTPUT [id^="obniz_label_"]{
          font-size: 15px !important;
          /* ★修正【フランス語体験対応】: white-space:normal(折り返し許可)
             だったが、JS側(fitDispFont)で実際の文字幅を測って1行に
             収まるようフォントサイズを自動縮小する方式に変更したため、
             ここではnowrap(折り返し禁止)にする。normal!importantのまま
             だとJSのwhite-space:nowrap指定と競合し、縮小してもなお
             折り返ってしまうため。 */
          white-space: nowrap !important;
        }
      }
    </style>

    <style>
      /* ============================================================
         ★追加: △パターン操作パネル（p=1 の時に使用）のスタイル
         ============================================================ */
      :root{
        --panel-main: #1f5c73;
        --panel-hover: #dceaf0;
        --panel-red: #cc2b2b;
      }
      html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; height:100%; }
      body{
        margin:0;
        height:100vh;
        display:flex;
        flex-direction:column;
        overflow:hidden;
      }
      /* ============================================================
         ★修正: 実機モード(d=0)接続時、obniz.js側が独自のUI要素を
         bodyに追加することがあり、それがflexレイアウトに影響して
         パネルが縮む問題があったため、position:fixedで画面全体を覆う
         独立コンテナにし、他の要素の影響を受けないようにする。
         ウィンドウ自体が既に画面の半分になっている前提で、
         そのウィンドウいっぱいに、縦横比2:3を保ったまま最大限フィットさせる。
         ============================================================ */
      .wrap{
        position:fixed;
        inset:0;
        z-index:9000;
        background:#fff;
        display:flex;
        flex-direction:column;
        /* ★追加: 何らかの理由で中身が画面高さより大きくなった場合でも、
           ボタン等が画面外に切れて操作不能になるより、.wrap自身の中で
           スクロールできる方が安全（保険的な設定）。 */
        overflow-y:auto;
      }
      /* ★修正: パネルは上下中央(align-items:center)に配置していたが、
         画面の上寄りに置くよう変更(align-items:flex-start)。 */
      .panel-stage{
        flex:1 1 auto;
        min-height:0;
        display:flex;
        /* ★修正【ランプ絵とパネルの間隔がウィンドウ幅で伸び縮みする問題・
           続き】: justify-content:centerだと、illust-stage側が高さ制約で
           1/4幅より小さくなった分だけpanel-stage側がflex-growで余分に
           広がり、その中でpanelが中央寄せされることでillust-stageとの間に
           大きな空白ができてしまっていた(ウィンドウを広げるほど顕著)。
           flex-startにして、panelが常にillust-stageのすぐ隣(間隔は
           content-rowのgapのみ)に来るようにする。余った幅は右側の余白に
           なるだけなので、ここは目立たない。 */
        justify-content:flex-start;
        align-items:flex-start;
        /* 左右のpaddingもvw基準だとwindow幅でillustとの間隔がわずかに
           伸び縮みするため、固定pxにする(上下は従来通りvhのまま)。 */
        padding:1.5vh 12px;
        box-sizing:border-box;
      }
      /* ============================================================
         ★PoC再設計3: 実機を模したイラストではなく、「たかさ」「方向」を
         それぞれ独立したシンプルなゲージ表示にする(縦棒+ボール／半円分度器+バー)。
         操作パネルの横に置くための行コンテナ(p=1: contentRow内、
         p=0: standard-illust-row)は従来通り。
         ============================================================ */
      .content-row{
        flex:1 1 auto;
        min-height:0;
        display:flex;
        flex-direction:row;
        /* ★修正【ランプ絵とパネルの間隔がウィンドウ幅で伸び縮みする問題】:
           gapがvw単位(ウィンドウ幅に比例)だったため、ウィンドウを広げると
           ランプ絵とパネルの間隔もどんどん広がってしまっていた。
           間隔は常に一定にしたいので固定px値にする。 */
        gap:16px;
        width:100%;
      }
      /* ★方針転換: 固定pxサイズやvw/vh基準のサイズ調整を色々試したが、

         OBNIZ_OUTPUTの合計幅)の1/4」という単純な比率指定に統一した。
         flex-growをillust側1・パネル/ボタン側3にすることで、
         gapを除いた残り幅がちょうど1:3(=1/4:3/4)に分配される。
         高さはaspect-ratio(148:300)でその幅から自動的に決まる。 */
      .content-row .panel-stage{
        flex:3 1 0;
        min-width:0;
      }
      /* ★修正: パネル側をalign-items:flex-start(上寄せ)にしたが、

         算出)が変わり、中央揃えの結果イラストの位置だけ上下にずれて
         見える不具合があった。パネル側と同じflex-startに揃えることで、
         画面幅によらず常に同じ上端位置から始まるようにした。 */
      .illust-stage{
        flex:1 1 0;

        align-items:center;
        justify-content:center;

(async function main() {

// ========================================

// data:URL等、sessionStorageが使用禁止の環境でも落ちないようにする
//
// ★修正【iOS Safariでガードが解除されず張り付く問題への対策】:
// 以前はbeforeunloadでフラグを消すだけの方式だったが、iOS Safariでは
// タブを閉じても実際には「一時停止」扱いになり(タブの復元機能等)、
// beforeunloadが確実に発火しないケースがあり、フラグが残り続けて
// 「このタブはすでに起動中です」から永久に進めなくなる不具合があった。
// 単なる「起動フラグの有無」ではなく「フラグに記録した時刻が新しいか」
// で判定するタイムスタンプ方式に変更し、本当に開いているタブは一定間隔
// (HEARTBEAT_MS)でフラグを更新し続け、閉じた(更新が止まった)タブの
// フラグは STALE_MS 経過後に自動的に無効(古い)とみなして解除する。
// これにより、beforeunload等のイベントが発火しなくても、一定時間後に
// 必ず自己解決する。
// ========================================

const TAB_KEY = "OBNIZ_RAMP_TAB_LOCK";
const TAB_STALE_MS = 5000;   // このミリ秒より古いフラグは「閉じたタブの残骸」とみなす
const TAB_HEARTBEAT_MS = 2000; // 開いている間、この間隔でフラグの時刻を更新し続ける

function safeSessionGet(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return null; }
}
function safeSessionSet(key, value) {
  try { sessionStorage.setItem(key, value); } catch (e) { /* 無視 */ }
}
function safeSessionRemove(key) {
  try { sessionStorage.removeItem(key); } catch (e) { /* 無視 */ }
}

const _tabLockRaw = safeSessionGet(TAB_KEY);
const _tabLockAt = _tabLockRaw ? Number(_tabLockRaw) : NaN;
const _tabLockFresh = !isNaN(_tabLockAt) && (Date.now() - _tabLockAt) < TAB_STALE_MS;

if (_tabLockFresh) {
  // ★修正【フランス語体験対応】: この時点ではまだLG(表示言語)の解析前
  // だが、lgパラメータだけをその場で直接読み取り、日本語以外なら
  // フランス語表示にする(常に日本語固定だったのを修正)。
  const _tabLockLg = (new URLSearchParams(location.search).get('lg') || 'J').toUpperCase();
  const _tabLockMsg = (_tabLockLg === 'J')
    ? 'このタブはすでに起動中です'
    : 'Cet onglet est déjà en cours d’exécution';
  document.body.innerHTML =
    "<h3 style='text-align:center;margin-top:40vh;'>" + _tabLockMsg + "</h3>";
  throw new Error("Blocked: duplicate tab");
}

safeSessionSet(TAB_KEY, String(Date.now()));
setInterval(() => { safeSessionSet(TAB_KEY, String(Date.now())); }, TAB_HEARTBEAT_MS);

window.addEventListener("beforeunload", () => {
  safeSessionRemove(TAB_KEY);
});
window.addEventListener("pagehide", () => {
  safeSessionRemove(TAB_KEY);
});

// ========================================
// ★追加: テストモード：FAKE OBNIZ（実機なしでシミュレーション）
// たかさ(EEPROM ADDR_HEIGHT=0x0000)と左右位置(ADDR_DIRECTION=0x0010)を
// メモリ上に保持し、実機がなくてもエラーにならず動作を確認できます。
// d=1 の時のみ使用（d=0 の時は本物の Obniz クラスを使用）。
// ========================================

class FakeObniz {
  constructor(id) {
    this.id = id;
    this._onconnect = null;
    this._onclose = null;

    this._eeprom = { 0x0000: 50, 0x0010: 0 };
    this._eepromPointer = 0;

    this.i2c0 = {
      start: () => {},
      write: async (addr, dataArray) => {
        await FakeObniz._wait(5);
        if (dataArray.length >= 3) {
          const regAddr = (dataArray[0] << 8) | dataArray[1];
          this._eeprom[regAddr] = dataArray[2];
        } else if (dataArray.length === 2) {
          this._eepromPointer = (dataArray[0] << 8) | dataArray[1];
        }
      },
      readWait: async () => {
        await FakeObniz._wait(5);
        const v = this._eeprom[this._eepromPointer];
        return [v === undefined ? 0 : v];
      },
    };

    this.io11 = {
      output: (v) => { console.log("[FakeObniz] io11 output:", v); },
    };

    this.display = {
      print: (t) => console.log("[FakeObniz display]", t),
      clear: () => {},
    };
  }

  static _wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  wired(type) {
    if (type === "ServoMotor") {
      return { angle: (v) => console.log("[FakeObniz] servo angle:", v) };
    }
    if (type === "StepperMotor") {
      return {
        stepType: () => {},
        speed: () => {},
        holdWait: async () => { await FakeObniz._wait(10); },
        freeWait: async () => { await FakeObniz._wait(10); },
        stepWait: async (steps) => {
          await FakeObniz._wait(Math.min(400, Math.abs(steps) / 2 + 30));
        },
      };
    }
    return {};
  }

  set onconnect(fn) {
    this._onconnect = fn;
    setTimeout(() => {
      if (typeof this._onconnect === "function") this._onconnect();
    }, 100);
  }
  get onconnect() { return this._onconnect; }

  set onclose(fn) { this._onclose = fn; }
  get onclose() { return this._onclose; }
}

let UU = new ObnizUI.Button(btn_UU);
let DD = new ObnizUI.Button(btn_DD);
let L = new ObnizUI.Button(btn_L);
let R = new ObnizUI.Button(btn_R);
let LL = new ObnizUI.Button(btn_LL);
let RR = new ObnizUI.Button(btn_RR);
let H0 = new ObnizUI.Button(btn_H0);
let H50 = new ObnizUI.Button(btn_H50);

// ========================================
// ★追加: △パネル操作連携（p=1 の時のみ有効化）
// U/D/L/R/PIT の標準ボタンを非表示にして、△パネルの5ボタンから
// .click() を呼んで isClicked() に反映させる。bploadingとDISPも
// パネル内へ移動する。p=0 の時はこの処理は一切行わず、標準UIのまま。
// ========================================
if (PANEL_MODE) {
  document.getElementById('customPanelWrap').style.display = 'flex';

  // ★修正【デグレード対策】: .wrapは実機接続時のサイズ崩れ対策で
  // position:fixed;inset:0(画面全体オーバーレイ)にしたため、
  // .wrapの外にあるデモバナーが裏に隠れて見えなくなっていた。
  // デモバナーを.wrapの内側(panelStageより前)へ移動し、
  // オーバーレイの最前面に表示されるようにする。
  (function () {
    const wrapEl = document.getElementById('customPanelWrap');
    const bannerEl = document.getElementById('demoModeBanner');
    // ★変更: panelStageはcontentRowの子になったため、挿入基準もcontentRowにする
    const stageEl = document.getElementById('contentRow');
    if (wrapEl && bannerEl && stageEl) {
      wrapEl.insertBefore(bannerEl, stageEl);
    }
  })();

  // ========================================
  // ★追加【スマホでボタン下端が画面外に切れる対策】: .wrapはposition:fixed;
  // inset:0で画面全体を覆う想定だが、モバイルブラウザ(特にアプリ内蔵
  // ブラウザ等)ではアドレスバーの表示/非表示でレイアウトビューポートと
  // 実際に見えている範囲(visual viewport)がズレることがあり、inset:0が
  // 実際より大きい高さを取ってしまい、その中の要素(パネル下段のボタン等)
  // が画面外にはみ出して見える不具合があった。window.visualViewportが
  // 使える環境では、それを使って.wrapの高さを実際に見えている高さに
  // 明示的に合わせる。
  (function () {
    const wrapElForHeight = document.getElementById('customPanelWrap');
    function fitWrapHeight() {
      if (!wrapElForHeight) return;
      const vv = window.visualViewport;
      const h = vv ? vv.height : window.innerHeight;
      wrapElForHeight.style.height = h + 'px';
    }
    fitWrapHeight();
    window.addEventListener('resize', fitWrapHeight);
    window.addEventListener('orientationchange', fitWrapHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitWrapHeight);
      window.visualViewport.addEventListener('scroll', fitWrapHeight);
    }
  })();

  // ========================================
  // ★変更: CSSのaspect-ratioだけでは横長ウィンドウ時に比率が崩れるため、
  // JSでwrapの実際の空きスペースを計算し、2:3を保ったまま最大限フィット
  // する幅/高さ(px)を都度計算して明示的に指定する（object-fit:containと同じ考え方）。
  // ========================================
  (function () {
    // ★変更: 全体の幅を1.15倍に(元は2:3 → 2*1.15:3)
    const TARGET_RATIO = (2 / 3) * 1.15; // width / height
    function fitPanelToWindow() {
      const stage = document.getElementById('panelStage');
      const panel = stage ? stage.querySelector('.panel') : null;
      if (!stage || !panel) return;
      const cs = getComputedStyle(stage);
      const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
      const availW = stage.clientWidth - padX;
      const availH = stage.clientHeight - padY;
      if (availW <= 0 || availH <= 0) return;

      let w = availW;
      let h = w / TARGET_RATIO;
      if (h > availH) {
        h = availH;
        w = h * TARGET_RATIO;
      }
      panel.style.width = w + 'px';
      panel.style.height = h + 'px';

      // ★修正【ランプ絵はみ出し/極端縮小対策・再修正】: 一度は「panelの
      // 実描画幅(w)の1/3」を基準にしていたが、panelは幅優先→高さが
      // 収まらなければ高さ優先で縮小するため、panelが高さ制約で縮んだ
      // 場面ではillust側までつられて必要以上に小さくなってしまっていた
      // (幅がpanel次第で変わり、間隔もvw基準で開いてしまう問題もあった)。
      // ここではcontent-row自体の「1/4幅」を独立したバジェットとして
      // 直接計算し(panelの縮小結果に依存させない)、それでもcontent-rowの
      // 高さに収まらない場合だけ高さ基準に切り替える(object-fit:containと
      // 同じ考え方)。gapも固定px(CSS側でgap:16px化)にしたので、
      // ウィンドウ幅を変えても間隔は一定のまま。
      const illustStageEl = document.getElementById('illustStage');
      const contentRowEl = document.getElementById('contentRow');
      // ★追加: m=1の時はillustStageをcontentRowに配置していないため、
      // ここでのサイズ計算自体が不要(無駄な処理を避けるだけで、
      // 動作上はillustStageEl && contentRowElの判定だけでも実害はない)。
      if (illustStageEl && contentRowEl && !M) {
        const rowCs = getComputedStyle(contentRowEl);
        const gapPx = parseFloat(rowCs.columnGap || rowCs.gap) || 0;
        const rowW = contentRowEl.clientWidth;
        const rowH = contentRowEl.clientHeight;
        const widthBudget = Math.max(0, (rowW - gapPx) / 4);
        let illustW = widthBudget;
        let illustH = illustW * (370 / 148); // viewBoxの縦横比(148:370)に合わせる
        if (illustH > rowH) {
          illustH = rowH;
          illustW = illustH * (148 / 370);
        }
        illustStageEl.style.flex = '0 0 ' + illustW + 'px';
        illustStageEl.style.width = illustW + 'px';
        illustStageEl.style.height = illustH + 'px';
      }

      // ★修正【なげるギミック対策・再修正】: 情報パネル(左右ボタンに挟まれた
      // 中央の狭いエリア)自身の実際の幅を測り、そこに収まるフォントサイズを計算する。
      // 演出の最長行は「全角スペース20個＋絵文字(約2em)＋◯(1em)」＝約23単位分の
      // 幅になるため、情報パネルの実幅の中にそれが収まるサイズにする
      // （はみ出し防止に少し余裕を持たせて24で割る）。パネル全体は展開しない。
      const infoPanelEl0 = document.getElementById('infoPanel');
      if (infoPanelEl0) {
        const infoW = infoPanelEl0.clientWidth -
          (parseFloat(getComputedStyle(infoPanelEl0).paddingLeft) || 0) -
          (parseFloat(getComputedStyle(infoPanelEl0).paddingRight) || 0);
        const pitFontSize = Math.max(6, Math.min(26, infoW / 24));
        panel.style.setProperty('--pit-font', pitFontSize + 'px');
      }

      // ★追加【パネルタイトル折り返し対策】: タイトル(「オンラインボッチャ
      // [ランプ1]」等)のfont-sizeは固定34pxだったため、panelがウィンドウ
      // 形状によって想定より狭くなる場面(高さ優先で縮小された時等)に
      // 折り返して赤い見出し帯からはみ出す不具合があった。基準サイズ(34px)
      // での実際の文字幅を測り、パネル幅に収まるよう比例縮小することで、
      // 言語(J/F)やランプ番号の桁数によらず常に1行に収まるようにする。
      const titleEl = panel.querySelector('.panel-title');
      if (titleEl) {
        const BASE_TITLE_FONT = 34;
        titleEl.style.fontSize = BASE_TITLE_FONT + 'px';
        const padLR = (parseFloat(getComputedStyle(titleEl).paddingLeft) || 0) +
          (parseFloat(getComputedStyle(titleEl).paddingRight) || 0);
        const availTitleW = titleEl.clientWidth - padLR;
        const textW = titleEl.scrollWidth - padLR;
        if (availTitleW > 0 && textW > availTitleW) {
          const scaled = Math.max(12, BASE_TITLE_FONT * (availTitleW / textW) * 0.95);
          titleEl.style.fontSize = scaled + 'px';
        }
      }
    }
    fitPanelToWindow();
    // ★修正: 初回はDOM変更直後でレイアウトが未確定な場合があるため、
    // レイアウト確定後（次の描画フレーム後）にもう一度計算し直す
    requestAnimationFrame(function () {
      requestAnimationFrame(fitPanelToWindow);
    });
    window.addEventListener('resize', fitPanelToWindow);
    window.addEventListener('orientationchange', fitPanelToWindow);

    // ★追加【d=0時の崩れ対策】: 実機モード(obniz.js)が接続中にDOMへ
    // 独自の要素（接続状態表示等）を追加し、それによってbodyのflexレイアウトが
    // 圧迫されパネルが小さくなる現象への対策。bodyの子要素の増減を監視し、
    // 変化があるたびにパネルサイズを再計算する。
    const bodyObserver = new MutationObserver(function () {
      requestAnimationFrame(fitPanelToWindow);
    });
    bodyObserver.observe(document.body, { childList: true });
  })();

  [U, D, L, R, PIT].forEach(function (btn) {
    const el = document.getElementById('obniz_button_' + btn.no);
    if (el) el.style.display = 'none';
  });

  // ★追加: 1つのアクションが完了(ACTION_LOCK解除)するまで、△パネルの
  // ボタンは押しても反応しないようにする(連打による多重動作・誤操作対策)。
  // ACTION_LOCKはobniz.onconnect内の各アクションで管理されているため、
  // ここでは値を直接見るだけ(=false)の時だけ橋渡し(.click())を通す。
  document.getElementById('btnUp').addEventListener('click', function () { if (!ACTION_LOCK) U.click(); });
  document.getElementById('btnDown').addEventListener('click', function () { if (!ACTION_LOCK) D.click(); });
  document.getElementById('btnLeft').addEventListener('click', function () { if (!ACTION_LOCK) L.click(); });
  document.getElementById('btnRight').addEventListener('click', function () { if (!ACTION_LOCK) R.click(); });
  document.getElementById('btnThrow').addEventListener('click', function () { if (!ACTION_LOCK) PIT.click(); });

  // タイトル(bploading)をパネル上部へ移動
  const panelEl = document.querySelector('#customPanelWrap .panel');
  const bploadingEl = document.getElementById('bploading');
  if (panelEl && bploadingEl) {
    bploadingEl.classList.add('panel-title');
    panelEl.insertBefore(bploadingEl, panelEl.firstChild);
  }

  // ★追加: ACTION_LOCK中は見た目もボタンを押せない状態(グレーアウト+
  // pointer-events:none)にする。ACTION_LOCKは複数箇所で書き換わるため、
  // 個々の書き換え箇所には手を入れず、rAFで値を監視してクラスに反映する。
  if (panelEl) {
    (function () {
      let lastBusy = null;
      function syncPanelBusy() {
        const busy = !!ACTION_LOCK;
        if (busy !== lastBusy) {
          panelEl.classList.toggle('panel-busy', busy);
          lastBusy = busy;
        }
        requestAnimationFrame(syncPanelBusy);
      }
      requestAnimationFrame(syncPanelBusy);
    })();
  }

  // DISP（「たかさ...OK!」表示）を情報パネルの中へ移動
  const infoPanel = document.getElementById('infoPanel');
  const dispDom = document.getElementById('obniz_label_' + DISP.no);
  if (infoPanel && dispDom) {
    dispDom.classList.add('disp-text');
    dispDom.style.fontSize = '';
    dispDom.style.padding = '';
    infoPanel.appendChild(dispDom);
  }

  // ★変更: △パネル表示時は、パネルに含まれない予備ボタン
  // （いちばんうえ／たくさん／まんなか等）も非表示にする。
  // 判定基準は DEMO_MODE ではなく PANEL_MODE
  // （デモは全表示パターン共通のモードとして適用したため、
  //   「パネルにない予備ボタンを隠す」のはパネル表示固有の話として分離）。
  // 標準UI（p=0）の時は実機・デモ問わずすべて表示する。
  [H100, UU, DD, LL, RR, H0, H50].forEach(function (btn) {
    const el = document.getElementById('obniz_button_' + btn.no);
    if (el) el.style.display = 'none';
  });
}

// ========================================
// ★追加: イラスト表示(#illustStage)を操作パネルの隣に配置する。
// PANEL_MODEの分岐だが、DEMO_MODEとは独立(2軸設計を踏襲)。
// p=1: contentRow内、panelStageの手前に挿入。
// p=0: OBNIZ_OUTPUTの内部構造には手を入れず、その手前に横並び行
//      (standard-illust-row)を新設してイラストと標準UIを並べる。
// ========================================
(function () {
  const illustEl = document.getElementById('illustStage');
  if (!illustEl) return;
  // ★追加: m=1の時はメーター(illustStage)を配置・表示しない。
  // 元のHTML上の位置(neutral、display:none)のまま何もしないだけなので、
  // contentRow/standard-illust-row側のレイアウトにも影響しない
  // (p=1ならpanel-stageがcontent-rowの唯一のflex子として自然に幅いっぱいに
  // 広がる。p=0ならstandard-illust-row自体を作らずOBNIZ_OUTPUTを従来位置のまま)。
  if (M) return;
  if (PANEL_MODE) {
    const contentRowEl = document.getElementById('contentRow');
    const panelStageEl = document.getElementById('panelStage');
    if (contentRowEl && panelStageEl) {
      contentRowEl.insertBefore(illustEl, panelStageEl);
    }
  } else {
    const obnizOutputEl = document.getElementById('OBNIZ_OUTPUT');
    if (obnizOutputEl && obnizOutputEl.parentNode) {
      const rowEl = document.createElement('div');
      rowEl.className = 'standard-illust-row';
      obnizOutputEl.parentNode.insertBefore(rowEl, obnizOutputEl);
      rowEl.appendChild(illustEl);
      rowEl.appendChild(obnizOutputEl);

      // ★追加【p=0のランプ絵はみ出し/極端縮小対策】: p=1のfitPanelToWindowと
      // 同じ考え方で、illust-stageのサイズをOBNIZ_OUTPUT(標準UI本体)の
      // 実際の描画サイズに連動させる。以前はflex:1(=行の1/4幅)+
      // aspect-ratioのCSSだけで高さを決めていたため、OBNIZ_OUTPUT側の
      // 実際の高さと無関係にillust側だけ大きく/小さくなり、はみ出しや
      // 極端な縮小が起きていた。OBNIZ_OUTPUTの幅の1/3を基準に、高さが
      // OBNIZ_OUTPUTの実際の高さを超える場合は高さ基準に切り替える
      // (object-fit:containと同じ考え方)。
      const fitIllustToStandardUI = function () {
        const outW = obnizOutputEl.offsetWidth;
        const outH = obnizOutputEl.offsetHeight;
        if (outW <= 0 || outH <= 0) return;
        // ★修正: 実機確認で「もう少し大きく」との要望を受け、
        // 幅の取り分を1/3→1/2.4→1/1.8にさらに増やした
        let iw = outW / 1.8;
        let ih = iw * (370 / 148);
        if (ih > outH) {
          ih = outH;
          iw = ih * (148 / 370);
        }
        illustEl.style.flex = '0 0 ' + iw + 'px';
        illustEl.style.width = iw + 'px';
        illustEl.style.height = ih + 'px';
      };
      fitIllustToStandardUI();
      requestAnimationFrame(function () {
        requestAnimationFrame(fitIllustToStandardUI);
      });
      window.addEventListener('resize', fitIllustToStandardUI);
      window.addEventListener('orientationchange', fitIllustToStandardUI);
      // OBNIZ_OUTPUTは標準UIライブラリが非同期に中身を組み立てるため、
      // 構築が進む度にサイズを再計算する。
      const outputObserver = new MutationObserver(function () {
        requestAnimationFrame(fitIllustToStandardUI);
      });
      outputObserver.observe(obnizOutputEl, { childList: true, subtree: true });

      // ★追加【フランス語体験対応・メッセージ幅対策】: 上部メッセージ
      // (「たかさ...OK!」/フランス語だと"à gauche 100 --> ..."のように
      // 長くなる)が、狭い画面向けの@media font-sizeだけでは収まらず
      // 2行に折り返ってしまうケースがあったため、実際の文字幅を測って
      // 都度フォントサイズを自動縮小する(p=1のパネルタイトルと同じ考え方)。
      // white-space:nowrapにして常に1行に収める。
      const dispElForFit = document.getElementById('obniz_label_' + DISP.no);
      if (dispElForFit) {
        dispElForFit.style.whiteSpace = 'nowrap';
        dispElForFit.style.overflow = 'hidden';
        let lastDispText = null;
        const fitDispFont = function () {
          const el = dispElForFit;
          const availW = obnizOutputEl.clientWidth -
            (parseFloat(getComputedStyle(obnizOutputEl).paddingLeft) || 0) -
            (parseFloat(getComputedStyle(obnizOutputEl).paddingRight) || 0);
          if (availW <= 0) return;
          // @mediaで設定された基準サイズ(狭い画面なら15px、それ以外は
          // ライブラリ既定値)をベースに、そこから収まる分だけ縮小する。
          // el.style.fontSizeを一旦空にしてCSS由来の基準値を測る。
          el.style.fontSize = '';
          const baseSize = parseFloat(getComputedStyle(el).fontSize) || 15;
          el.style.fontSize = baseSize + 'px';
          const textW = el.scrollWidth;
          if (textW > availW) {
            const scaled = Math.max(8, baseSize * (availW / textW) * 0.95);
            el.style.fontSize = scaled + 'px';
          }
        };
        fitDispFont();
        requestAnimationFrame(function () { requestAnimationFrame(fitDispFont); });
        window.addEventListener('resize', fitDispFont);
        window.addEventListener('orientationchange', fitDispFont);
        // メッセージの内容が変わるたびに再計算する(高さ/左右移動・言語切替等)。
        const dispObserver = new MutationObserver(function () {
          if (dispElForFit.textContent !== lastDispText) {
            lastDispText = dispElForFit.textContent;
            fitDispFont();
          }
        });
        dispObserver.observe(dispElForFit, { characterData: true, childList: true, subtree: true });
      }
    }
  }
  illustEl.style.display = 'flex';
})();

let ONCONNECT_LOCK = false;
let LOOP_ACTIVE = false;
// ★追加: △パネル(p=1)のボタン橋渡し処理(main()側、onconnectの外)からも
// 「アクション実行中かどうか」を参照できるよう、外側スコープで宣言する
// (元はonconnect内のローカル変数だった)。
let ACTION_LOCK = false;

obniz.onconnect = async function () {

  if (ONCONNECT_LOCK) {
    console.log("duplicate onconnect blocked");
    return;
  }

  try {

  ONCONNECT_LOCK = true;
  LOOP_ACTIVE = true;


// ========================================
// STATE VARIABLE
// ========================================

    let servomotor;
    // let DISP; // 外に移動したため削除

    // ボタンの宣言は外へ移動したため削除

    let MESSAGE = '', COLOR = '', RAMP = '';

    let STEP = 0;

    let LOC_No = 0, LOC_No_N = 0, LOC_D = 0;

    let LR_No = 0, LR_No_N = 0;
    let LR_No_DSP = 0, LR_No_N_DSP = 0;
    let LR_D = 0;

    let LR_LR = '', LR_N_LR = '';

    // ★変更: ACTION_LOCKは外側スコープへ移動したため、ここでは再宣言せず
    // 接続の度にfalse(未ロック)へリセットするだけにする。
    ACTION_LOCK = false;
	LOOP_ACTIVE = true;

// ========================================
// CONSTANT
// ========================================

// EEPROM

    const EEPROM_ADDR = 0x50;
    const ADDR_HEIGHT = 0x0000;
    const ADDR_DIRECTION = 0x0010;

// function ==============================================================================================

// ========================================
// Utility
// ========================================

// delay function ----------------------------------------------------------------------------------

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

// 音声読み上げ function ----------------------------------------------------------------------------------

    // ★修正【スマホで読み上げが無音になる対策】: SpeechSynthesisUtteranceを
    // ローカル変数のまま作ると、発声中にガベージコレクションされて途中で
    // 無音になる既知のブラウザ不具合がある(モバイルほど発生しやすい)。
    // speak()関数の外側(main()スコープ)の変数に保持し続けることで、
    // 発声が終わるまで参照が残るようにする。
    // また、直前の発声が何らかの理由でキューに残ったままだと以降の
    // speak()が無音のまま無視されることがあるため、話す前に必ず
    // cancel()してキューをクリアしておく。
    let _lastUtterance = null;
    function speak(text) {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      _lastUtterance = utterance;

      if (LG === 'J') {
      utterance.lang = 'ja-JP';
      } else {
      utterance.lang = 'fr-FR';
    }
       speechSynthesis.speak(utterance);
    }

// ========================================
// EEPROM
// ========================================

//-[EEPROM Function]----------------------------------------------------------------------------------

    async function writeEEPROM(address, value) {
      const high = (address >> 8) & 0xFF;
      const low = address & 0xFF;
      await obniz.i2c0.write(EEPROM_ADDR, [high, low, value]);
      await delay(500); // 書き込み完了待ち（必要に応じて調整）
    }

    async function readEEPROM(address) {
      const high = (address >> 8) & 0xFF;
      const low = address & 0xFF;
      await obniz.i2c0.write(EEPROM_ADDR, [high, low]);
      const data = await obniz.i2c0.readWait(EEPROM_ADDR, 1);
      return data[0];
    }

// ========================================
// Display / Position
// ========================================

// LR check function ----------------------------------------------------------------------------------
    function check_LR() {
       if (LR_No < 0) {
           LR_LR = msg_L;

// パネルUIでは色ボールを△パネル側に常時表示しているため、

    function fmtIdle() {
      if (PANEL_MODE) {
        return [msg_H, LOC_No_N, '\n', LR_LR, LR_No_N_DSP, '\n', msg_inp].join('');
      } else {
        return [COLOR, msg_H, LOC_No_N, LR_LR, LR_No_N_DSP, msg_inp].join('');
      }
    }
    function fmtHeightMoving(oldV, newV) {
      if (PANEL_MODE) {
        return [msg_H, '\n', oldV, '\n', '↓', '\n', newV].join('');
      } else {
        return [COLOR, msg_H, oldV, ' --> ', newV].join('');
      }
    }
    function fmtHeightArrived(newV, label) {
      if (PANEL_MODE) {
        return [msg_H, newV, '\n', label].join('');
      } else {
        return [COLOR, msg_H, newV, label].join('');
      }
    }
    function fmtLRMoving(oldLabel, oldVal, newLabel, newVal, limitMsg) {
      if (PANEL_MODE) {
        return [oldLabel, oldVal, '\n', '↓', '\n', newLabel, newVal, limitMsg].join('');
      } else {
        // ★修正【p=0・幅対策】: 既に限界値に達していて実質移動しなかった
        // 場合(oldLabel/oldValとnewLabel/newValが同じ)、従来は
        // "à gauche 100 --> à gauche 100 Limite"のように同じ値を2回
        // 表示する冗長な文言になり、フランス語等の長い文字列で折り返る
        // 原因にもなっていた。実際に「到達した」遷移(oldとnewが異なる)の
        // 場合は従来通り遷移を表示しつつ、既に限界のまま動かなかった
        // 場合だけ現在値+Limiteのみのシンプルな表示にする(たかさ100/
        // みぎ100等、どの値の限界かは維持する)。
        if (limitMsg && oldLabel === newLabel && oldVal === newVal) {
          return [COLOR, newLabel, newVal, limitMsg].join('');
        }
        return [COLOR, oldLabel, oldVal, ' --> ', newLabel, newVal, limitMsg].join('');
      }
    }

// ========================================
// ★追加: たかさ・方向イラスト(#illustStage)の更新。
// PANEL_MODE/DEMO_MODEを問わず常に呼ぶ(実機モードでも値が変わるたびに
// 追従表示する。実際に動くかどうかは実機接続時に別途確認が必要)。
// ========================================
    function updateIllustHeight(value) {
      const ballEl = document.getElementById('illustHeightBall');
      if (!ballEl) return;
      const clamped = Math.max(0, Math.min(100, value));
      // ボールはcy=115(value=50相当)で描画済み。0=y185/100=y45になるよう
      // 140px幅で上下させる分のズレ量を、描画位置からの相対移動として与える。
      const dy = 70 - (clamped / 100) * 140;
      ballEl.style.transform = 'translateY(' + dy + 'px)';
    }
    // ★修正: 絵の上部の値表示(移動後の値のみ、矢印表示は無し)は、当初
    // updateIllustHeight()の中で一緒に更新していたが、それだと「50→52」の
    // 移動中表示をしている間に(ボールと同時に)先に「たかさ52」が
    // 出てしまい、パネルのメッセージが実際に「52 OK!」へ切り替わる
    // タイミングとズレて見える、との指摘があった。ボールの移動アニメーション
    // (updateIllustHeight())と値表示の更新タイミングを分離し、値表示は
    // CF()(=パネルのfmtIdle()が確定するのと同じタイミング)でのみ
    // 更新するようにした。
    function updateIllustHeightLabel(value) {
      const heightLabelEl = document.getElementById('illustHeightValueLabel');
      if (!heightLabelEl) return;
      const clamped = Math.max(0, Math.min(100, value));
      heightLabelEl.textContent = msg_H + clamped;
    }
    // ★追加: パネルのメッセージ(fmtIdle()等)と同じ形式(msg_L/msg_R + 絶対値)で、
    // 方向の値表示テキストを組み立てる。check_LR()のLR_LR/LR_No_DSP算出と同じロジック。
    function lrValueLabelText(value) {
      const lr = value < 0 ? msg_L : (value > 0 ? msg_R : ' ');
      return lr + Math.abs(value);
    }
    // ★修正: たかさと同様、方向の値表示もupdateIllustLR()(針のアニメーション)
    // から切り離し、CF()のタイミングでのみ更新するようにした。
    function updateIllustLRLabel(value) {
      const directionLabelEl = document.getElementById('illustDirectionValueLabel');
      if (!directionLabelEl) return;
      const clamped = Math.max(-100, Math.min(100, value));
      directionLabelEl.textContent = lrValueLabelText(clamped);
    }
    // ★追加: 方向ゲージの楕円(中心100,325・Rx=41・Ry=70)上の、
    // 値(-100〜100、角度は±90°)に対応する座標を返す。
    // 目盛りの点(SVG側に静的配置)と、針の先端(下のupdateIllustLR())の
    // 両方で同じ計算式を使うことで、針の先端が必ず目盛り上を通るようにする。
    const NEEDLE_RX = 41, NEEDLE_RY = 70, NEEDLE_CX = 100, NEEDLE_CY = 325;
    function needleTipFor(value) {
      const rad = (value / 100 * 90) * Math.PI / 180;
      return {
        x: NEEDLE_CX + NEEDLE_RX * Math.sin(rad),
        y: NEEDLE_CY - NEEDLE_RY * Math.cos(rad),
      };
    }
    let lrNeedleCurrentValue = null; // null=未初期化(初回は即座に反映しアニメーションしない)
    let lrNeedleAnimFrame = null;
    function updateIllustLR(value) {
      const needleLineEl = document.getElementById('illustDirectionNeedleLine');
      if (!needleLineEl) return;
      const target = Math.max(-100, Math.min(100, value));
      function setTip(v) {
        const tip = needleTipFor(v);
        needleLineEl.setAttribute('x2', tip.x.toFixed(2));
        needleLineEl.setAttribute('y2', tip.y.toFixed(2));
      }
      if (lrNeedleCurrentValue === null) {
        // 初回(ページ表示直後)はアニメーションさせず即座に反映
        setTip(target);
        lrNeedleCurrentValue = target;
        return;
      }
      // ★変更: 楕円の縁は角度によって中心からの距離(=針の長さ)が変わるため、
      // CSSのtransform:rotate(固定長のまま回転=真円の軌跡)ではなく、
      // requestAnimationFrameで値を補間しながら先端(x2/y2)を毎フレーム
      // 再計算する。moveLR()のDEMO_MODEディレイ(500ms)+待機時間の目安に
      // 合わせてDURATIONは0.6secのまま維持。
      const start = lrNeedleCurrentValue;
      const DURATION = 600;
      const startTime = performance.now();
      if (lrNeedleAnimFrame) cancelAnimationFrame(lrNeedleAnimFrame);
      function frame(now) {
        const t = Math.min(1, (now - startTime) / DURATION);
        const eased = 1 - Math.pow(1 - t, 2); // ease-out相当
        setTip(start + (target - start) * eased);
        if (t < 1) {
          lrNeedleAnimFrame = requestAnimationFrame(frame);
        } else {
          lrNeedleAnimFrame = null;
        }
      }
      lrNeedleCurrentValue = target;
      lrNeedleAnimFrame = requestAnimationFrame(frame);
    }

    function step_u(size) {
      if (size === 'S') {
        STEP = LOC_D / 2 * -55 -5 ;

async function moveHeight(delta, isBig, playFreq) {

  await pos_set();

  obniz.io11.output(true); // Lock ON

  // 目標値計算
  LOC_No = LOC_No_N + delta;

  // 限界処理
  if (LOC_No >= 100) LOC_No = 100;
  if (LOC_No <= 0) LOC_No = 0;

  // ロック解除（既存仕様維持）
  await motor1.holdWait();
  motor1.speed(100);
  await motor1.stepWait(10);

  LOC_D = LOC_No_N - LOC_No;

  DISP.setText(fmtHeightMoving(LOC_No_N, LOC_No));
  // ★追加: ボールの移動アニメーションは、CF()を待たずここで開始する。
  // 「50 → 30」等の移動中表示をしている間にボールも一緒に動くようにする
  // (以前はCF()呼び出し時=移動完了後にしか動いておらず、表示とズレていた)。
  updateIllustHeight(LOC_No);

  // スピード（小/大）
  motor1.speed(isBig ? 200 : 100);

  // 方向判定
  if (delta > 0) {
    step_u(RS);
  } else {
    step_d(RS);
  }

  await motor1.stepWait(STEP + 10);

  // ★追加: デモモードは、実機のモーター動作時間を実測して反映することを
  // 検討したが断念し、代わりに移動中の表示をユーザーが確認できるよう
  // 一律で2000msのディレイを入れる（p=0/p=1共通。実機はモーター動作時間が
  // これに相当するため不要）。moveLR()の同様のディレイと対応。
  if (DEMO_MODE) {
    await ObnizUI.Util.wait(2000);
  }

  obniz.io11.output(false);
  await motor1.freeWait();

  LOC_No_N = LOC_No;

  await writeEEPROM(ADDR_HEIGHT, LOC_No);

  // 音
  await _ai.playAudio(playFreq, 1 * (isBig ? 100 : 50));

  if (LOC_No === 100 || LOC_No === 0) {
    speak(msg_LM);
  }

  await CF();
}

async function setHeightPreset(target, label, voice) {

  await pos_set();

  obniz.io11.output(true); // Lock ON

  LOC_No_N = await readEEPROM(ADDR_HEIGHT);
  LOC_No = target;

  DISP.setText(fmtHeightMoving(LOC_No_N, LOC_No));
  // ★追加: moveHeight()と同様、ボールの移動アニメーションはCF()を待たず
  // ここ(「いちばんうえ/した/まんなか」の移動中表示と同時)で開始する。
  updateIllustHeight(LOC_No);

  await motor1.holdWait();
  motor1.speed(200);
  await motor1.stepWait(10);

  LOC_D = LOC_No_N - LOC_No;

  await writeEEPROM(ADDR_HEIGHT, LOC_No);

  if (LOC_D > 0) {
    motor1.speed(300);
    step_d(RS);
  } else {
    motor1.speed(200);
    step_u(RS);
  }

  await motor1.stepWait(STEP);

  // ★追加: 上と同様、デモモードは移動中の表示確認用に2000msのディレイを
  // 入れる（いちばんうえ／いちばんした／まんなか、p=0/p=1共通）。
  if (DEMO_MODE) {
    await ObnizUI.Util.wait(2000);
  }

  obniz.io11.output(false);
  await motor1.freeWait();

  LOC_No_N = LOC_No;

  DISP.setText(fmtHeightArrived(LOC_No_N, label));

  await _ai.playAudio(500, 1 * 100);
  speak(voice);

  await CF();
}

async function moveLR(delta, speedValue, playFreq) {

  await pos_set();

  // 現在値更新
  LR_No = LR_No_N + delta;

  // 限界処理（ここで止める）
  let isLimit = false;

  if (LR_No >= 100) {
    LR_No = 100;
    isLimit = true;
  }

  if (LR_No <= -100) {
    LR_No = -100;
    isLimit = true;
  }

  check_LR();

  DISP.setText(fmtLRMoving(LR_N_LR, LR_No_N_DSP, LR_LR, LR_No_DSP, isLimit ? msg_LM : ''));

  motor2.speed(speedValue);

  LR_D = LR_No_N - LR_No;
  STEP = LR_D * 4;

  await motor2.stepWait(STEP);

  // ★追加: デモモードは、移動中の表示をユーザーが確認できるよう
  // 途中に500msのディレイを入れる（実機はモーター動作時間がこれに相当するため不要）
  if (DEMO_MODE) {
    await ObnizUI.Util.wait(500);
  }

  LR_No_N = LR_No;
  LR_No_N_DSP = LR_No_DSP;

  await _ai.playAudio(playFreq, 1 * 30);

  if (isLimit) {
    speak(msg_LM);
  }
  await motor2.freeWait();
  await CF();
}

        if (PANEL_MODE) {
          const infoPanelEl = document.getElementById('infoPanel');
          if (infoPanelEl) infoPanelEl.classList.add('pit-anim');
        } else {
          // ★追加【p=0・スマホ対策】: なげるアニメ(全角スペースで作る
          // 横移動演出)は1行に収まる前提の文字数計算をしているため、
          // ラベルの実フォントサイズのままだと狭い画面で折り返して
          // 2段になり崩れて見えていた。OBNIZ_OUTPUT自体の実幅から
          // 収まるフォントサイズを計算し、演出中だけ縮小する
          // (p=1の--pit-fontと同じ考え方)。
          const dispElForPit = document.getElementById('obniz_label_' + DISP.no);
          const obnizOutputElForPit = document.getElementById('OBNIZ_OUTPUT');
          if (dispElForPit && obnizOutputElForPit) {
            const availW = obnizOutputElForPit.clientWidth || 300;
            const pitFontSize = Math.max(8, Math.min(24, availW / 24));
            dispElForPit.style.fontSize = pitFontSize + 'px';
            dispElForPit.style.whiteSpace = 'nowrap';
          }
        }
        // ★修正: ○も2倍サイズに、移動幅(leading/trailing)を2倍に拡大。
        // 空行(<br>)を2つ入れることで、たかさ表示位置の2行下へ表示位置をずらす。
        // ★修正【幅が広がるデグレード対策】: 開始位置(1フレーム目)を含む全フレームで
        // 左側を1単位減らし、その分を右端(◯の後ろ)の余白として追加する。
        // これにより「合計の文字数(=幅計算の基準値24)」は変えずに、
        // 開始位置だけをボール1つ分左へ寄せられる。
        // ★修正【p=0デグレード対策】: 上記の絵文字2倍サイズ・表示位置を2行
        // 下げる演出は、△パネルUI(p=1)の狭い情報パネルに収めるための専用調整。
        // 以前は document.getElementById('obniz_label_'+DISP.no) の存在有無で
        // 分岐していたが、標準UI(p=0、本物のobniz-parts-kits使用)でも同じID
        // パターンの要素が存在するため意図せず適用されてしまっていた
        // (「ワクの見た目はPANEL_MODEでのみ分岐する」という2軸設計の原則に反する)。
        // PANEL_MODEを直接見て分岐し、p=0は従来通りの等倍サイズ・位置ズレなしの
        // 単純な文字列表示のままにする。
        function setDispBallFrame(panelLeading, panelTrailing, plainLeading, plainTrailing) {
          if (PANEL_MODE) {
            const dispEl = document.getElementById('obniz_label_' + DISP.no);
            if (dispEl) {
              dispEl.innerHTML = '<br><br>' + panelLeading +
                '<span class="pit-ball">' + COLOR + '</span>' +
                panelTrailing + '<span class="pit-ball">◯</span>' + '　';
              return;
            }
          }
          DISP.setText([plainLeading, COLOR, plainTrailing + '◯'].join(''));
        }
        setDispBallFrame('　', '　　　　　　　　　　　　　　　　　　', '　', '　　　　　　　　　');
        await _ai.playAudio(350,1 * 30);
        await ObnizUI.Util.wait(300);
        setDispBallFrame('　　　　　', '　　　　　　　　　　　　　　', '　　　', '　　　　　　　');
        await _ai.playAudio(350,1 * 30);
        await ObnizUI.Util.wait(300);
        setDispBallFrame('　　　　　　　　　', '　　　　　　　　　　', '　　　　　', '　　　　　');
        await _ai.playAudio(350,1 * 30);
        await ObnizUI.Util.wait(300);
        setDispBallFrame('　　　　　　　　　　　　　　　', '　　　　', '　　　　　　　　', '　　');
        await _ai.playAudio(350,1 * 30);
        await ObnizUI.Util.wait(300);
        setDispBallFrame('　　　　　　　　　　　　　　　　　　　', '', '　　　　　　　　　　', '');
        await ObnizUI.Util.wait(680);
        servomotor.angle(135);
        await _ai.playAudio(390,1 * 100);

        // ★修正【一瞬だけ広がるデグレード対策】: pit-animクラスの解除を
        // pos_set()の直前（テキストが短くなる直前）まで遅らせる。
        // 以前はservomotor.angle()やplayAudio()の待機中(約100ms)、
        // 「まだ長いアニメーション文字列」のまま「通常フォントサイズ」に
        // 戻ってしまい、その間だけ枠が広がって見えていた。
        if (PANEL_MODE) {
          const infoPanelEl2 = document.getElementById('infoPanel');
          if (infoPanelEl2) infoPanelEl2.classList.remove('pit-anim');
        } else {
          // ★追加【p=0・スマホ対策・続き】: 演出中だけ縮小したフォントサイズを
          // 元に戻す(空にして、外部ライブラリ本来のスタイルに戻す)。
          const dispElForPit2 = document.getElementById('obniz_label_' + DISP.no);
          if (dispElForPit2) {
            dispElForPit2.style.fontSize = '';
            dispElForPit2.style.whiteSpace = '';
          }
        }
        await pos_set();
        await CF();
        } finally {
          ACTION_LOCK = false;
        }

//-[U]----------------------------------------------------------------------------------

//-[LOOP]----------------------------------------------------------------------------------
      } else {
        // ★【修正箇所】待機時のウェイトを ObnizUI.Util.wait に統一
        await ObnizUI.Util.wait(500);
        MESSAGE = '';
      }
	  }
    } catch (e) {
    // ★追加: 外部CDN(obniz.js等)側の関数呼び出しで例外が起きても、ここで
    // 直接catchすれば実IDやその他の詳細情報を含まない安全な形でメッセージ・
    // スタックトレースを見られる（window.onerror経由だとcross-originの
    // 制約で「Script error.」としてしか表示されないための対策）
    console.error('[obniz.onconnect] エラー:', e);
    var msg = document.getElementById('fatal-error-banner');
    if (!msg) {
      msg = document.createElement('div');
      msg.id = 'fatal-error-banner';
      msg.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#d32f2f;color:#fff;padding:10px 14px;font-size:13px;z-index:9999;white-space:pre-wrap;font-family:monospace;';
      document.body.prepend(msg);
    }
    msg.textContent += (msg.textContent ? '\n' : '') +
      'エラー(onconnect内): ' + (e && e.message ? e.message : String(e)) +
      (e && e.stack ? '\n' + e.stack : '');
  } finally {
    ONCONNECT_LOCK = false;
    LOOP_ACTIVE = false;
  }
};

obniz.onclose = function () {
  LOOP_ACTIVE = false;
  ONCONNECT_LOCK = false;  // ★修正: 再接続時に必ずクリーンな状態から始められるようにする
  ACTION_LOCK = false;     // ★追加: 切断時にボタンが押せないままロックされ続けないようにする
};
